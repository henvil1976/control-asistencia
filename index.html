<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia IE - Supabase</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #6366f1; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --bg: #f3f4f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); padding: 20px; min-height: 100vh; }
        .container { max-width: 700px; margin: 0 auto; background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #111827; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #6b7280; margin-bottom: 24px; font-size: 14px; }
        #reader { border-radius: 12px; overflow: hidden; margin-bottom: 16px; background: #000; }
        .status-card { background: #f8fafc; border-radius: 12px; padding: 16px; margin: 16px 0; display: none; animation: fade 0.3s; }
        .status-card.show { display: block; }
        @keyframes fade { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: 600; color: white; }
        .temprano { background: var(--success); } .en-punto { background: #3b82f6; } .tarde { background: var(--warning); } .demasiado-tarde { background: var(--danger); }
        .config { border-top: 2px solid #e5e7eb; margin-top: 24px; padding-top: 20px; }
        .config h3 { margin-bottom: 12px; color: #374151; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; color: #4b5563; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
        .input-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
        .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .btn:hover { opacity: 0.9; } .btn-secondary { background: #6b7280; } .btn-success { background: var(--success); }
        .log { margin-top: 12px; padding: 10px; background: #f1f5f9; border-radius: 6px; font-family: monospace; font-size: 13px; display: none; }
        .log.show { display: block; }
        .success { color: var(--success); } .error { color: var(--danger); }
        .db-status { padding: 8px; border-radius: 8px; margin-bottom: 16px; text-align: center; font-size: 14px; }
        .db-connected { background: #d1fae5; color: #065f46; }
        .db-disconnected { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <h1> Control de Asistencia</h1>
        <p class="subtitle">Escanea el QR al ingreso | IE [Nombre]</p>
        
        <div id="dbStatus" class="db-status db-disconnected">⏳ Conectando a base de datos...</div>
        
        <div id="reader"></div>
        
        <div id="statusCard" class="status-card">
            <div id="studentName" style="font-size: 18px; font-weight: 600; color: #111827; margin-bottom: 6px;">-</div>
            <div id="arrivalInfo" style="color: #4b5563; margin-bottom: 8px;">-</div>
            <div style="text-align: center;"><span id="statusBadge" class="badge">-</span></div>
        </div>

        <div class="config">
            <h3>⚙️ Configuración</h3>
            <div class="input-group"><label>Supabase URL:</label><input type="text" id="supabaseUrl" placeholder="https://xxxxx.supabase.co"></div>
            <div class="input-group"><label>Supabase Publishable Key:</label><input type="text" id="supabaseKey" placeholder="sb_publishable_..."></div>
            <div class="input-group"><label>Token Bot Telegram:</label><input type="text" id="botToken" placeholder="1234567890:ABCdef..."></div>
            <div class="input-group"><label>Chat ID de prueba:</label><input type="text" id="chatIdTest" placeholder="5892341067"></div>
            <div class="input-group"><label>Hora entrada esperada:</label><input type="time" id="horaEntrada" value="08:00"></div>
            <button class="btn" onclick="guardarConfig()">💾 Guardar Configuración</button>
            <button class="btn btn-secondary" onclick="probarTelegram()">📱 Probar Telegram</button>
            <!-- BOTÓN RESTAURADO -->
            <button class="btn btn-success" onclick="descargarCSV()">📥 Descargar Respaldo CSV</button>
        </div>

        <div id="log" class="log"></div>
    </div>

    <script>
        // 🔌 Conexión a Supabase
        let supabaseClient = null;
        let dbConnected = false;
        
        let config = {
            supabaseUrl: localStorage.getItem('supabaseUrl') || '',
            supabaseKey: localStorage.getItem('supabaseKey') || '',
            botToken: localStorage.getItem('botToken') || '',
            chatIdTest: localStorage.getItem('chatIdTest') || '',
            horaEntrada: localStorage.getItem('horaEntrada') || '08:00'
        };
        let scanner;
        let registrosHoy = []; // Para guardar en memoria local y exportar

        window.onload = async () => {
            document.getElementById('supabaseUrl').value = config.supabaseUrl;
            document.getElementById('supabaseKey').value = config.supabaseKey;
            document.getElementById('botToken').value = config.botToken;
            document.getElementById('chatIdTest').value = config.chatIdTest;
            document.getElementById('horaEntrada').value = config.horaEntrada;
            
            await inicializarSupabase();
            iniciarScanner();
        };

        async function inicializarSupabase() {
            if (!config.supabaseUrl || !config.supabaseKey) {
                actualizarEstadoDB('❌ Configura credenciales de Supabase', false);
                return;
            }
            
            try {
                supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseKey);
                const { data, error } = await supabaseClient.from('estudiantes').select('id_estudiante').limit(1);
                if (error) throw error;
                
                dbConnected = true;
                actualizarEstadoDB('✅ Conectado a Supabase', true);
            } catch (error) {
                actualizarEstadoDB('❌ Error: ' + error.message, false);
            }
        }

        function actualizarEstadoDB(mensaje, conectado) {
            const el = document.getElementById('dbStatus');
            el.textContent = mensaje;
            el.className = `db-status ${conectado ? 'db-connected' : 'db-disconnected'}`;
        }

        function guardarConfig() {
            config.supabaseUrl = document.getElementById('supabaseUrl').value.trim();
            config.supabaseKey = document.getElementById('supabaseKey').value.trim();
            config.botToken = document.getElementById('botToken').value.trim();
            config.chatIdTest = document.getElementById('chatIdTest').value.trim();
            config.horaEntrada = document.getElementById('horaEntrada').value;
            
            localStorage.setItem('supabaseUrl', config.supabaseUrl);
            localStorage.setItem('supabaseKey', config.supabaseKey);
            localStorage.setItem('botToken', config.botToken);
            localStorage.setItem('chatIdTest', config.chatIdTest);
            localStorage.setItem('horaEntrada', config.horaEntrada);
            
            mostrarLog('✅ Configuración guardada', 'success');
            inicializarSupabase();
        }

        function iniciarScanner() {
            scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess, () => {}).catch(err => {
                mostrarLog(`❌ Error cámara: ${err}`, 'error');
            });
        }

        // ✅ FUNCIÓN DE FECHA SEGURA (Perú)
        function obtenerFechaLocal() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`; // Formato: YYYY-MM-DD
        }

        async function onScanSuccess(qrText) {
            scanner.pause();
            
            const hoy = obtenerFechaLocal();
            const ahora = new Date();
            const hora = ahora.toLocaleTimeString('es-PE', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
            
            // 1. Verificar duplicados
            if (dbConnected && supabaseClient) {
                const { data: registros } = await supabaseClient
                    .from('asistencias')
                    .select('id')
                    .eq('id_estudiante', qrText)
                    .eq('fecha', hoy)
                    .maybeSingle();
                
                if (registros) {
                    mostrarLog(`⏸️ ${qrText} ya registró hoy (${hoy}).`, 'success');
                    setTimeout(() => scanner.resume(), 2000);
                    return;
                }
            }
            
            // 2. Buscar estudiante
            let estudiante = null;
            if (dbConnected && supabaseClient) {
                const { data, error } = await supabaseClient
                    .from('estudiantes')
                    .select('*')
                    .eq('id_estudiante', qrText)
                    .single();
                
                if (error) {
                    mostrarLog(`❌ Estudiante no encontrado: ${qrText}`, 'error');
                    setTimeout(() => scanner.resume(), 2000);
                    return;
                }
                estudiante = data;
            }
            
            const estado = calcularEstado(ahora);
            
            // 3. Guardar en Supabase
            if (dbConnected && supabaseClient) {
                const { error } = await supabaseClient.from('asistencias').insert({
                    id_estudiante: qrText,
                    fecha: hoy, // Enviamos YYYY-MM-DD
                    hora_llegada: hora,
                    estado: estado,
                    dispositivo: 'Web'
                });
                
                if (error) {
                    mostrarLog(`❌ Error al guardar: ${error.message}`, 'error');
                    setTimeout(() => scanner.resume(), 2000);
                    return;
                }
            }
            
            // 4. Guardar localmente para el CSV
            registrosHoy.push({
                id: qrText,
                nombre: estudiante.nombre_completo,
                grado: estudiante.grado_seccion,
                hora: hora,
                estado: estado,
                fecha: hoy
            });

            // 5. Mostrar en pantalla
            document.getElementById('studentName').textContent = estudiante.nombre_completo;
            document.getElementById('arrivalInfo').textContent = `🕐 ${hora} | 📚 ${estudiante.grado_seccion}`;
            const badge = document.getElementById('statusBadge');
            badge.textContent = estado;
            badge.className = `badge ${estado.toLowerCase().replace(/ /g, '-')}`;
            document.getElementById('statusCard').classList.add('show');
            
            if (estudiante.chat_id_telegram) {
                enviarTelegram(estudiante, hora, estado);
            }
            
            setTimeout(() => {
                scanner.resume();
                document.getElementById('statusCard').classList.remove('show');
            }, 3000);
        }

        function calcularEstado(fecha) {
            const [h, m] = config.horaEntrada.split(':').map(Number);
            const esperado = h * 60 + m;
            const actual = fecha.getHours() * 60 + fecha.getMinutes();
            const diff = actual - esperado;
            
            if (diff < -15) return 'Temprano';
            if (diff <= 5) return 'En punto';
            if (diff <= 20) return 'Tarde';
            return 'Demasiado tarde';
        }

        async function enviarTelegram(estudiante, hora, estado) {
            if (!config.botToken || !config.chatIdTest) return;
            const msg = `📚 *Ingreso Registrado*\n ${estudiante.nombre_completo}\n ${estudiante.grado_seccion}\n ${hora}\n📊 ${estado}`;
            
            try {
                const res = await fetch(`https://api.telegram.org/bot${config.botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: estudiante.chat_id_telegram || config.chatIdTest, text: msg, parse_mode: 'Markdown' })
                });
                if (res.ok) mostrarLog('✅ Notificación enviada', 'success');
            } catch (e) { mostrarLog(`❌ Error Telegram`, 'error'); }
        }

        async function probarTelegram() {
            if (!config.botToken || !config.chatIdTest) return mostrarLog('⚠️ Configura Token y Chat ID primero', 'error');
            try {
                const res = await fetch(`https://api.telegram.org/bot${config.botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: config.chatIdTest, text: '✅ Bot OK' })
                });
                const d = await res.json();
                mostrarLog(d.ok ? '📱 ¡Prueba exitosa!' : `❌ ${d.description}`, d.ok ? 'success' : 'error');
            } catch (e) { mostrarLog(`❌ ${e.message}`, 'error'); }
        }

        // ✅ FUNCIÓN RESTAURADA: Descargar CSV
        function descargarCSV() {
            if (registrosHoy.length === 0) return mostrarLog('📭 No hay registros nuevos para exportar.', 'success');
            
            let csv = 'ID,Nombre,Grado,Hora,Estado,Fecha\n';
            registrosHoy.forEach(r => {
                csv += `${r.id},"${r.nombre}","${r.grado}",${r.hora},"${r.estado}",${r.fecha}\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); 
            a.href = url; 
            a.download = `asistencia_${obtenerFechaLocal()}.csv`;
            a.click(); 
            URL.revokeObjectURL(url);
            mostrarLog(' CSV descargado.', 'success');
        }

        function mostrarLog(msg, tipo) {
            const el = document.getElementById('log');
            el.textContent = msg;
            el.className = `log show ${tipo}`;
            setTimeout(() => el.classList.remove('show'), 4000);
        }
    </script>
</body>
</html>
